# niri-touch-gestures configuration
# All values shown are the defaults; delete anything you don't want to change.

[device]
# Substring of the touchscreen's device name. Empty = auto-detect the first
# direct-touch multitouch device (your Surface: "MELF0411:00 1FD2:9005").
name = ""
# "auto" asks niri for the output rotation. If swipes feel rotated after you
# rotate the screen, force one of: "normal", "90", "180", "270",
# "flipped", "flipped-90", "flipped-180", "flipped-270".
transform = "auto"

[gestures]
# "native" (default): 3/4-finger touches are replayed on a virtual touchpad,
# so niri's own continuous gesture handling takes over — the view moves 1:1
# with your fingers and animates with release velocity, exactly like the
# trackpad. Your niri touchpad settings (natural-scroll etc.) apply.
# "discrete": the daemon interprets swipes itself and fires the [actions]
# below in steps — use this if you want custom mappings.
mode = "native"
# Native-mode gains. "auto" gives true direct manipulation: windows and
# workspaces move exactly as far as your fingers do on the glass. It is
# computed from the screen's physical size, niri's gesture constants, and
# the libinput accel profile/speed read from your niri config (re-read on
# service restart). Set a number to override: 1.0 = trackpad-equivalent
# finger travel (much faster than 1:1), smaller = slower.
scale_x = "auto"
scale_y = "auto"
# The 4-finger Overview gesture is a zoom, not a drag, so 1:1 does not
# apply; this multiplies trackpad-equivalent travel (bigger = shorter swipe).
scale_overview = 1.0

# All distances are physical millimeters on the glass.
deadzone_mm = 6.0        # travel before a gesture engages (both modes)

# Window gestures (native mode only):
# Hold 3 fingers still on a window for this long (ms) to pick it up and
# move it (Mod+left drag); hold 4 fingers to resize it (Mod+right drag).
# 0 disables. The hold arms whenever the fingers settle, so landing wiggle
# doesn't prevent the grab.
hold_ms = 300
# While moving a window, parking it within this many mm of the top/bottom
# screen edge switches to the workspace above/below after
# move_edge_delay_ms, repeating every move_edge_repeat_ms (0 disables).
move_edge_mm = 12.0
move_edge_delay_ms = 250
move_edge_repeat_ms = 600

# Multi-finger taps: all fingers down and up within tap_ms, no movement.
# A second 3-finger tap within double_tap_ms fires three_double.
tap_ms = 250
double_tap_ms = 400

# 1-finger edge strips: touch within strip_mm of the left/right screen edge
# and drag vertically (strip_arm_mm to arm) to run the [actions.strip]
# commands, one step per strip_step_mm of travel. Taps and horizontal
# swipes in the zone reach apps unchanged (after at most strip_timeout_ms).
# 0 disables.
strip_mm = 4.0
strip_arm_mm = 5.0
strip_step_mm = 3.0
strip_timeout_ms = 250
# Pinch fingers together / apart by this many mm (mean contact distance
# from the centroid) to fire the [actions.pinch] entries below.
# Lower = snappier. 0 disables that direction.
pinch_close_mm = 12.0
pinch_out_mm = 12.0
# Modifier for the move drag; must match your niri Mod key.
move_modifier = "Super"
# The rest applies to discrete mode only:
trigger_mm = 28.0        # first step of a 3-finger swipe
repeat_mm = 36.0         # each further step while you keep swiping
overview_mm = 22.0       # first step of a 4-finger swipe
flick_min_mm = 8.0       # a short...
flick_speed_mm_s = 130.0 # ...but fast flick also counts as one step

# The [actions] tables are used in discrete mode only.
# Directions below are the direction YOUR FINGERS move. The defaults are
# "direct manipulation": the canvas follows your fingers, like scrolling on a
# phone — swipe left to reveal the column on the right, swipe down to go to
# the workspace above. Swap the pairs if you prefer the opposite.
# Any `niri msg action ...` works here; "" disables a direction.

[actions]
command = "niri msg action"

[actions.three]
left = "focus-column-right"
right = "focus-column-left"
up = "focus-workspace-down"
down = "focus-workspace-up"

[actions.four]
up = "open-overview"
down = "close-overview"
left = ""
right = ""

# Pinch gestures (native mode): direction + finger count -> niri action.
# "window-zoom-in"/"window-zoom-out" are built-ins that walk the focused
# window through: partial column -> maximized column (Mod+F) -> maximized
# to edges (Mod+M) -> fullscreen (F11), and back. "spawn ..." runs a
# command. Other actions focus the window under your fingers first.
# "" disables.
[actions.pinch]
in3 = "close-window"
out3 = "spawn kitty"
in4 = "window-zoom-out"
out4 = "window-zoom-in"
in5 = "screenshot"
out5 = ""

# Taps -> niri actions ("" disables).
[actions.tap]
five = "spawn vicinae toggle"
three_double = "toggle-window-floating"

# Edge strips -> shell commands (not niri actions), run once per step.
[actions.strip]
right_up = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+"
right_down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"
left_up = "brightnessctl set 3%+"
left_down = "brightnessctl set 3%-"
